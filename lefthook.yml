pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,json,css}"
      run: bunx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    readme-skills:
      run: bun run check:readme-skills
    typecheck:
      run: bun run typecheck
    test:
      run: bun run test
